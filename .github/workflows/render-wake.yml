name: Wake Render service

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  wake-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -euo pipefail
          test -n "$RENDER_URL"
          curl --fail --silent --show-error --max-time 30 "${RENDER_URL%/}/health" > /dev/null
          echo "Render service is awake: ${RENDER_URL%/}/health"
