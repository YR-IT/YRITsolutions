<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#92400E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#78350F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Scales of justice base -->
  <rect x="47" y="70" width="6" height="20" fill="url(#bronzeGrad)"/>
  <rect x="40" y="88" width="20" height="4" fill="url(#bronzeGrad)"/>
  
  <!-- Central pole -->
  <rect x="49" y="20" width="2" height="50" fill="url(#goldGrad)"/>
  
  <!-- Balance beam -->
  <rect x="25" y="28" width="50" height="3" fill="url(#goldGrad)"/>
  
  <!-- Left scale -->
  <rect x="20" y="32" width="15" height="2" fill="url(#bronzeGrad)"/>
  <path d="M22 34 Q27.5 38 33 34 L33 42 Q27.5 46 22 42 Z" fill="#E5E7EB"/>
  <line x1="27" y1="32" x2="27" y2="28" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Right scale -->
  <rect x="65" y="32" width="15" height="2" fill="url(#bronzeGrad)"/>
  <path d="M67 34 Q72.5 38 78 34 L78 42 Q72.5 46 67 42 Z" fill="#E5E7EB"/>
  <line x1="72" y1="32" x2="72" y2="28" stroke="url(#goldGrad)" stroke-width="1"/>
  
  <!-- Justice symbol at top -->
  <circle cx="50" cy="15" r="8" fill="#1F2937"/>
  <rect x="46" y="12" width="8" height="3" fill="#FFFFFF"/>
  <rect x="48" y="15" width="4" height="4" fill="#DC2626"/>
  
  <!-- Legal documents -->
  <rect x="15" y="50" width="12" height="15" fill="#FFFFFF" rx="1"/>
  <rect x="16" y="51" width="10" height="2" fill="#DC2626"/>
  <line x1="17" y1="55" x2="25" y2="55" stroke="#3B82F6" stroke-width="1"/>
  <line x1="17" y1="57" x2="25" y2="57" stroke="#3B82F6" stroke-width="1"/>
  <line x1="17" y1="59" x2="23" y2="59" stroke="#3B82F6" stroke-width="1"/>
  
  <rect x="73" y="50" width="12" height="15" fill="#FFFFFF" rx="1"/>
  <rect x="74" y="51" width="10" height="2" fill="#10B981"/>
  <line x1="75" y1="55" x2="83" y2="55" stroke="#6B7280" stroke-width="1"/>
  <line x1="75" y1="57" x2="83" y2="57" stroke="#6B7280" stroke-width="1"/>
  <line x1="75" y1="59" x2="81" y2="59" stroke="#6B7280" stroke-width="1"/>
  
  <!-- Gavel -->
  <rect x="85" y="25" width="12" height="4" fill="url(#bronzeGrad)" rx="2"/>
  <rect x="89" y="23" width="4" height="8" fill="url(#goldGrad)" rx="1"/>
  <circle cx="91" cy="31" r="2" fill="#DC2626"/>
  
  <!-- Law book -->
  <rect x="8" y="25" width="10" height="12" fill="#1F2937"/>
  <rect x="9" y="26" width="8" height="10" fill="#3B82F6"/>
  <rect x="10" y="28" width="6" height="1" fill="#FFFFFF"/>
  <rect x="10" y="30" width="6" height="1" fill="#FFFFFF"/>
</svg>
