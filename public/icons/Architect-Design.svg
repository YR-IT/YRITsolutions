<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Blueprint background -->
  <rect x="10" y="15" width="80" height="60" fill="url(#blueprintGrad)" rx="4"/>
  
  <!-- Building structure -->
  <rect x="20" y="25" width="15" height="35" fill="#F3F4F6"/>
  <rect x="40" y="20" width="20" height="40" fill="#E5E7EB"/>
  <rect x="65" y="30" width="15" height="30" fill="#F3F4F6"/>
  
  <!-- Building tops -->
  <rect x="20" y="22" width="15" height="3" fill="url(#buildingGrad)"/>
  <rect x="40" y="17" width="20" height="3" fill="url(#buildingGrad)"/>
  <rect x="65" y="27" width="15" height="3" fill="url(#buildingGrad)"/>
  
  <!-- Windows -->
  <rect x="22" y="28" width="3" height="4" fill="#06B6D4"/>
  <rect x="27" y="28" width="3" height="4" fill="#06B6D4"/>
  <rect x="22" y="35" width="3" height="4" fill="#06B6D4"/>
  <rect x="27" y="35" width="3" height="4" fill="#06B6D4"/>
  
  <rect x="43" y="25" width="4" height="5" fill="#10B981"/>
  <rect x="50" y="25" width="4" height="5" fill="#10B981"/>
  <rect x="43" y="33" width="4" height="5" fill="#10B981"/>
  <rect x="50" y="33" width="4" height="5" fill="#10B981"/>
  
  <rect x="67" y="33" width="3" height="4" fill="#F59E0B"/>
  <rect x="72" y="33" width="3" height="4" fill="#F59E0B"/>
  <rect x="67" y="40" width="3" height="4" fill="#F59E0B"/>
  <rect x="72" y="40" width="3" height="4" fill="#F59E0B"/>
  
  <!-- Drafting tools -->
  <rect x="15" y="78" width="70" height="4" fill="#EF4444" rx="2"/>
  <circle cx="25" cy="85" r="3" fill="#8B5CF6"/>
  <rect x="22" y="87" width="6" height="2" fill="#F59E0B"/>
  
  <!-- Compass -->
  <circle cx="75" cy="85" r="4" fill="#10B981"/>
  <line x1="75" y1="82" x2="75" y2="88" stroke="white" stroke-width="1"/>
  <line x1="72" y1="85" x2="78" y2="85" stroke="white" stroke-width="1"/>
</svg>
